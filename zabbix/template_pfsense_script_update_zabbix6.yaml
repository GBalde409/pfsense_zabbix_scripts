zabbix_export:
  version: '6.0'
  date: '2026-10-30T00:00:00Z'
  groups:
  - uuid: 714fe777a4ea5da0966dbefd25773772
    name: Templates/O3
  templates:
  - uuid: 71bab9a5c43b5cf586c9be6a2462b752
    template: Template O3 pfSense Script Update
    name: Template O3 pfSense Script Update
    description: Atualizacao controlada do pfsense_zbx.php via GitHub, com bootstrap, hash, backup, status e cron noturno.
      Exige Zabbix agent como root; comandos remotos ja permitidos. Desativado por macro ate habilitar pilotos. Nenhum UserParameter
      novo.
    groups:
    - name: Templates/O3
    items:
    - uuid: d17b80f740775c3f9526bf4b41c0c639
      name: 'pfSense script: solicitar atualizacao'
      type: ZABBIX_PASSIVE
      key: system.run["test '{$PFSENSE.ZBX.UPDATE.ENABLED}' = 1 || exit 0; test \"$(/usr/bin/id -u)\" = 0 || exit 1; PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin;
        export PATH; umask 022; mkdir -p /root/scripts || exit 1; p=/root/scripts/pfsense_zbx_update.php; if [ ! -f \"$p\"
        ] || [ \"$(sha256 -q \"$p\")\" != '{$PFSENSE.ZBX.UPDATER.SHA256}' ]; then t=$(mktemp /root/scripts/.pfzu-bootstrap.XXXXXX)
        || exit 1; trap 'test ! -f \"$t\" || unlink \"$t\"' 0; curl --fail --silent --show-error --location --proto =https
        --proto-redir =https --connect-timeout 10 --max-time 45 --max-filesize 1048576 --output \"$t\" '{$PFSENSE.ZBX.UPDATER.URL}'
        && [ \"$(sha256 -q \"$t\")\" = '{$PFSENSE.ZBX.UPDATER.SHA256}' ] && /usr/local/bin/php -l \"$t\" >/dev/null && chmod
        0644 \"$t\" && mv -f \"$t\" \"$p\" || exit 1; fi; /usr/local/bin/php \"$p\" update '{$PFSENSE.ZBX.SCRIPT.URL}' '{$PFSENSE.ZBX.SCRIPT.SHA256}'",nowait]
      delay: '{$PFSENSE.ZBX.UPDATE.INTERVAL}'
      history: '0'
      trends: '0'
      tags:
      - tag: component
        value: pfsense-script-update
      value_type: UNSIGNED
      description: Disparo assincrono. Retorno 1 nao confirma instalacao. Exige agente como root; respeita UPDATE.ENABLED.
        Bootstrap confere hash antes de executar.
    - uuid: 569beba6e8df597890fc52100f913372
      name: 'pfSense script: UID de execucao do agente'
      type: ZABBIX_PASSIVE
      key: system.run[/usr/bin/id -u]
      delay: 5m
      history: 7d
      trends: '0'
      tags:
      - tag: component
        value: pfsense-script-update
      value_type: UNSIGNED
    - uuid: f43febea5de255f192c320c81ddd45e0
      name: 'pfSense script: status JSON'
      type: ZABBIX_PASSIVE
      key: vfs.file.contents[/var/db/pfsense-zbx-update/status.json]
      delay: 5m
      history: '0'
      trends: '0'
      tags:
      - tag: component
        value: pfsense-script-update
      value_type: TEXT
    - uuid: 30fc005b25b75b4dbec96dadcbe71488
      name: 'pfSense script: codigo da atualizacao'
      type: DEPENDENT
      key: pfz.update.code
      delay: '0'
      history: 7d
      trends: '0'
      value_type: UNSIGNED
      master_item:
        key: vfs.file.contents[/var/db/pfsense-zbx-update/status.json]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.code
      tags:
      - tag: component
        value: pfsense-script-update
      valuemap:
        name: pfSense script update status
    - uuid: 540022b447a85249bfc4cd93e7330b64
      name: 'pfSense script: ultima verificacao concluida/iniciada'
      type: DEPENDENT
      key: pfz.update.checked_at
      delay: '0'
      history: 7d
      trends: '0'
      value_type: UNSIGNED
      master_item:
        key: vfs.file.contents[/var/db/pfsense-zbx-update/status.json]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.checked_at
      tags:
      - tag: component
        value: pfsense-script-update
      units: unixtime
    - uuid: 28bf94795ee45318896c38e7b1e2b710
      name: 'pfSense script: ultima verificacao bem-sucedida'
      type: DEPENDENT
      key: pfz.update.last_success
      delay: '0'
      history: 7d
      trends: '0'
      value_type: UNSIGNED
      master_item:
        key: vfs.file.contents[/var/db/pfsense-zbx-update/status.json]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.last_success
      tags:
      - tag: component
        value: pfsense-script-update
      units: unixtime
    - uuid: 74ca4e277dad588394da4e55b1fdf42e
      name: 'pfSense script: versao instalada'
      type: DEPENDENT
      key: pfz.update.installed_version
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      master_item:
        key: vfs.file.contents[/var/db/pfsense-zbx-update/status.json]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.installed_version
      tags:
      - tag: component
        value: pfsense-script-update
    - uuid: 432a69414b47527e91e291eff35a4290
      name: 'pfSense script: SHA-256 instalado'
      type: DEPENDENT
      key: pfz.update.installed_sha256
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      master_item:
        key: vfs.file.contents[/var/db/pfsense-zbx-update/status.json]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.installed_sha256
      tags:
      - tag: component
        value: pfsense-script-update
    - uuid: 278771ba7f6f5fb69db5b8bc52072b87
      name: 'pfSense script: resultado detalhado'
      type: DEPENDENT
      key: pfz.update.message
      delay: '0'
      history: 7d
      trends: '0'
      value_type: CHAR
      master_item:
        key: vfs.file.contents[/var/db/pfsense-zbx-update/status.json]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.message
      tags:
      - tag: component
        value: pfsense-script-update
    macros:
    - macro: '{$PFSENSE.ZBX.UPDATE.ENABLED}'
      value: '0'
      description: 0=desativado; habilite 1 no host piloto antes de liberar no template.
    - macro: '{$PFSENSE.ZBX.UPDATE.INTERVAL}'
      value: 1h
      description: Depois do rollout pode mudar para 1d; ajuste MAX_AGE para 129600.
    - macro: '{$PFSENSE.ZBX.UPDATE.MAX_AGE}'
      value: '10800'
      description: Limite em segundos para verificacao atrasada; 10800=3h.
    - macro: '{$PFSENSE.ZBX.SCRIPT.URL}'
      value: https://raw.githubusercontent.com/GBalde409/pfsense_zabbix_scripts/04d1cec36b9d4c0d4b06a2edb056d13ca6a23599/pfsense_zbx.php
      description: Origem publica fixada em commit, sem token.
    - macro: '{$PFSENSE.ZBX.SCRIPT.SHA256}'
      value: eec799ae901baf5cf18326ef910e2ebe49173995b995b650b7234b5853c2256b
      description: Hash aprovado do script principal.
    - macro: '{$PFSENSE.ZBX.UPDATER.URL}'
      value: https://raw.githubusercontent.com/GBalde409/pfsense_zabbix_scripts/04d1cec36b9d4c0d4b06a2edb056d13ca6a23599/pfsense_zbx_update.php
      description: Origem do atualizador, verificada antes do bootstrap.
    - macro: '{$PFSENSE.ZBX.UPDATER.SHA256}'
      value: 53e6aeccb530b3df429d31aaaf42f27d04d6bd3250b918b94a529dd79b95b6f3
      description: Hash aprovado do atualizador.
    valuemaps:
    - uuid: cd174fb307bc595f9f833b2232ad7c4f
      name: pfSense script update status
      mappings:
      - value: '0'
        newvalue: Sucesso (atualizado ou atual)
      - value: '1'
        newvalue: Erro
      - value: '2'
        newvalue: Em execucao
      - value: '3'
        newvalue: Ainda nao executado
  triggers:
  - uuid: 2c9ac62e0d0d50d9a10c773d3d016f73
    name: 'pfSense script: agente sem permissao root'
    expression: '{$PFSENSE.ZBX.UPDATE.ENABLED}=1 and (last(/Template O3 pfSense Script Update/system.run[/usr/bin/id -u])<>0)'
    priority: HIGH
    tags:
    - tag: component
      value: pfsense-script-update
  - uuid: fa4494164fba5342a151483bd2830282
    name: 'pfSense script: falha na atualizacao'
    expression: '{$PFSENSE.ZBX.UPDATE.ENABLED}=1 and (last(/Template O3 pfSense Script Update/pfz.update.code)=1)'
    priority: HIGH
    tags:
    - tag: component
      value: pfsense-script-update
  - uuid: 364e773d563350d9a96bfaa76ee0bf1e
    name: 'pfSense script: status de atualizacao ausente'
    expression: '{$PFSENSE.ZBX.UPDATE.ENABLED}=1 and (nodata(/Template O3 pfSense Script Update/pfz.update.code,30m)=1)'
    priority: WARNING
    tags:
    - tag: component
      value: pfsense-script-update
  - uuid: e50801f88a835577bd6a0024a2113146
    name: 'pfSense script: verificacao de atualizacao atrasada'
    expression: '{$PFSENSE.ZBX.UPDATE.ENABLED}=1 and (now()-last(/Template O3 pfSense Script Update/pfz.update.checked_at)>{$PFSENSE.ZBX.UPDATE.MAX_AGE})'
    priority: WARNING
    tags:
    - tag: component
      value: pfsense-script-update
  - uuid: 9eb0c65b505754bda0ef91974182aee3
    name: 'pfSense script: atualizacao excedeu 10 minutos'
    expression: '{$PFSENSE.ZBX.UPDATE.ENABLED}=1 and (last(/Template O3 pfSense Script Update/pfz.update.code)=2 and now()-last(/Template
      O3 pfSense Script Update/pfz.update.checked_at)>600)'
    priority: WARNING
    tags:
    - tag: component
      value: pfsense-script-update
  - uuid: 996baabcfe925fb4a2ae55041c11a6fc
    name: 'pfSense script: hash instalado diferente do aprovado'
    expression: '{$PFSENSE.ZBX.UPDATE.ENABLED}=1 and (last(/Template O3 pfSense Script Update/pfz.update.code)=0 and last(/Template
      O3 pfSense Script Update/pfz.update.installed_sha256)<>"{$PFSENSE.ZBX.SCRIPT.SHA256}")'
    priority: WARNING
    tags:
    - tag: component
      value: pfsense-script-update
